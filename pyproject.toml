[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp1-zorch"
dynamic = ["version"]
description = "sp1-zorch — a lean SP1 prover built on zorch's scheme-agnostic blocks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The sp1-zorch Authors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
]
# pyzorch is the PyPI distribution of `zorch` (the `zorch` name is taken); the
# import package stays `zorch`. The frx stack (frx / frxlib / frx-cuda12-* /
# zk-dtypes) is deliberately not declared — it is the GPU-correctness-sensitive
# build the consuming workspace pins exactly in requirements.in.
dependencies = [
    "absl-py",
    "numpy",
    "pyzorch>=0.1.0",
]

# rw-constraints (SP1 chip definitions the shard prover loads — needed to
# actually prove) is served by the Fractalyze index, not PyPI. Install with:
#   pip install "sp1-zorch[full]" --extra-index-url https://fractalyze.github.io/pypi/simple/
[project.optional-dependencies]
full = ["rw-constraints>=0.1.0.dev0"]

[project.urls]
Repository = "https://github.com/fractalyze/sp1-zorch"

[tool.setuptools.dynamic]
version = { attr = "sp1_zorch.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["sp1_zorch*"]
