[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp1-zorch"
dynamic = ["version"]
description = "sp1-zorch — a lean SP1 prover built on zorch's scheme-agnostic blocks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The sp1-zorch Authors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
]
# pyzorch is the PyPI distribution of `zorch` (the `zorch` name is taken); the
# import package stays `zorch`. frx (imported directly as frx.numpy / frx.lax)
# pulls the CPU stack (frxlib, zk-dtypes) transitively, so `pip install sp1-zorch`
# is importable on its own; the `.dev0` floor stays compatible with the exact dev
# frx the consuming workspace pins in requirements.in (a plain `>=0.10.0` would
# conflict — dev builds sort below the release). GPU (the byte-match FFI path)
# still needs the frx-cuda12-* plugins, which are too large for PyPI; install
# them from the Fractalyze index (see requirements.in).
# rw-constraints carries the SP1 chip definitions, imported at module top level
# across zerocheck / logup_gkr / shard_prover — a hard requirement, not an
# extra. `.dev0` floor for the same reason as frx: a plain `>=0.1.0` would
# reject the dev wheel requirements.in pins (0.1.0.devN sorts below 0.1.0).
# Only release versions are published to PyPI, so a pure-PyPI resolve still
# lands on 0.1.0 or newer.
dependencies = [
    "absl-py",
    "numpy",
    "pyzorch>=0.1.0",
    "frx>=0.10.0.dev0",
    "rw-constraints>=0.1.0.dev0",
]

[project.urls]
Repository = "https://github.com/fractalyze/sp1-zorch"

[tool.setuptools.dynamic]
version = { attr = "sp1_zorch.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["sp1_zorch*"]
