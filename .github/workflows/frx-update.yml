#
# Receives an `frx-update` repository_dispatch from the jax repo's
# notify-downstream workflow and opens a pin-bump PR. sp1-zorch must be in that
# dispatcher's consumer list for events to arrive.
#
# `upstream_repo` stays jax because pip-bump interpolates it into a
# github.com/fractalyze/<repo>/commit link and the publishing repo is still
# named jax. `packages:` names this repo's pins, which moved to the frx
# names in #313 — the workflow kept bumping the old jax names for a week of
# green no-op runs before #317 caught it, so if the pins are ever renamed
# again, this list moves in the same PR.

name: FRX Update

on:
  repository_dispatch:
    types: [frx-update]

concurrency:
  group: frx-update
  cancel-in-progress: true

jobs:
  bump:
    runs-on: [self-hosted, cpu]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BUMPER_GH_PAT }}

      - name: Bump frx/frxlib/frx-cuda12-pjrt/frx-cuda12-plugin
        uses: fractalyze/github-actions/pip-bump@main
        with:
          upstream_repo: jax
          version: ${{ github.event.client_payload.frx_version }}
          upstream_commit: ${{ github.event.client_payload.commit }}
          packages: frx frxlib frx-cuda12-pjrt frx-cuda12-plugin
          github_token: ${{ secrets.BUMPER_GH_PAT }}
