#
# Release channel: builds sp1-zorch (pure Python, one `python -m build`) and
# publishes to TestPyPI or PyPI on dispatch (build-only skips the upload). The
# timestamped dev channel lives in dev-release.yml.
#
# Upload uses OIDC trusted publishing — one-time setup required: register a
# trusted publisher for project `sp1-zorch` on test.pypi.org AND pypi.org
# (this repo + workflow publish.yml + environment testpypi / pypi).

name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options:
          - testpypi
          - pypi
          - build-only
        default: testpypi

concurrency:
  group: publish
  cancel-in-progress: false

# Least privilege: the build job only reads source and uploads an artifact.
# The publish job overrides this with id-token: write for OIDC trusted publishing.
permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 3

  publish:
    name: Publish
    if: inputs.target != 'build-only'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: ${{ inputs.target }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
